<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김영곤 — 경남교육감 예비후보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── 디자인 시스템 ── */
:root {
  --mg: #FF006E; --ink: #050A14; --bg: #F8F9FA; --wh: #FFFFFF; --line: rgba(0,0,0,0.1);
}

/* ── 베이스 ── */
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }

/* ── 네비게이션 ── */
nav { position: fixed; top:0; width:100%; height:64px; z-index:1000; display: flex; align-items:center; justify-content:space-between; padding: 0 5%; background: #fff; border-bottom: 1px solid var(--line); }
.n-logo { font-family:'Noto Serif KR'; font-weight:900; font-size:1.2rem; text-decoration:none; color:var(--ink); }

/* ── 히어로 ── */
#hero { padding: 120px 5% 60px; background: var(--ink); color: #fff; text-align: center; }
.h-name { font-family:'Noto Serif KR'; font-size: 3.5rem; font-weight:900; line-height:1; margin-bottom:15px; }
.h-name span { color: var(--mg); }

/* ── 후보 소개 (About) ── */
.sec { padding: 60px 5%; }
.title { font-family:'Noto Serif KR'; font-size: 1.8rem; font-weight:900; margin-bottom:25px; line-height:1.3; }

/* ★ 지저분한 요소를 모두 제거한 사진 영역 ★ */
.about-wrap { display: flex; flex-direction: column; gap: 30px; }
.about-img { 
  width: 100%; 
  max-width: 400px; 
  margin: 0 auto; 
  display: block; /* 박스 형태 제거 */
}
.about-img img { 
  width: 100%; 
  height: auto; 
  display: block; 
  border-radius: 15px; /* 모서리만 살짝 둥글게 */
}

/* 경력 리스트 */
.career-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
.career-item { padding: 15px; background: #fff; border-radius: 10px; border: 1px solid var(--line); }
.career-item b { font-size: 0.75rem; color: var(--mg); display: block; margin-bottom: 5px; }
.career-item p { font-size: 0.95rem; font-weight: 600; }

/* ── 공약 및 정책 (아코디언 스타일 유지) ── */
#pledge { background: var(--bg); }
.p-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
.p-card { background: #wh; padding: 25px; border-radius: 15px; border: 1px solid var(--line); background: #fff; }
.p-card h3 { font-family: 'Noto Serif KR'; font-size: 1.1rem; color: var(--mg); margin-bottom: 10px; }

.pol-box { background: #fff; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--line); overflow: hidden; }
.pol-head { padding: 20px; font-weight: 800; display: flex; justify-content: space-between; cursor: pointer; background: #fafafa; }
.pol-body { padding: 20px; display: none; }
.pol-body.on { display: block; }

/* ── 후원 및 푸터 ── */
#support { background: var(--ink); color: #fff; text-align: center; padding: 80px 5%; }
.acct-info { border: 1px solid var(--mg); padding: 30px; border-radius: 15px; margin-top: 20px; }

footer { padding: 40px; text-align: center; font-size: 0.75rem; color: #999; border-top: 1px solid var(--line); }

/* 데스크탑 반응형 */
@media (min-width: 768px) {
  .about-wrap { flex-direction: row; align-items: flex-start; }
  .career-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<nav>
  <a href="#" class="n-logo">김영곤 <span>예비후보</span></a>
</nav>

<section id="hero">
  <h1 class="h-name">김영<span>곤</span></h1>
  <p class="h-slogan">아이의 하루를 책임지는 경남교육</p>
</section>

<section id="about" class="sec">
  <div class="about-wrap">
    <div class="about-img">
      <img src="yg.jpg" alt="김영곤 후보자">
    </div>
    <div class="about-content">
      <h2 class="title">경남이 키운 전문가<br>준비된 교육감 김영곤</h2>
      <div class="career-grid">
        <div class="career-item"><b>출생</b><p>경남 남해군 창선면 (진주고 졸업)</p></div>
        <div class="career-item"><b>학력</b><p>서울대 학사 / 동국대 박사</p></div>
        <div class="career-item"><b>공직</b><p>제36회 행시 합격 / 전) 교육부 차관보</p></div>
        <div class="career-item"><b>역임</b><p>OECD 정책분석가 / 국립국제교육원장</p></div>
      </div>
    </div>
  </div>
</section>

<script>
function togglePol(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('on');
}
</script>

</body>
</html>
