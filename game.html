<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kim-young-gon.vercel.app/game.html">
    <meta property="og:title" content="🎁 [김영곤] 경남교육감 출마예정자의 행운권">
    <meta property="og:description" content="김영곤이 드리는 우리 아이를 위한 행운의 공약!">
    <meta property="og:image" content="https://kim-young-gon.vercel.app/thumb.png">

    <title>경남교육감 출마예정자 김영곤</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-color: #FF00FF; }
        body { font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #fff0f5; }
        .container { background: #fff; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(255,0,255,0.1); border: 4px solid var(--main-color); }
        
        .badge { background: var(--main-color); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .kim-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--main-color); margin-bottom: 15px; object-fit: cover; background: #fff; }
        
        h1 { font-size: 1.4em; color: #333; margin: 5px 0; line-height: 1.4; }
        h1 span { color: var(--main-color); }

        #game-screen, #result-area { display: none; }
        
        .lucky-box { width: 180px; height: 180px; margin: 20px auto; background-image: url('thumb.png'); background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .btn { background: var(--main-color); color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; margin-top: 20px; font-weight: bold; font-size: 1.1em; width: 100%; }
        
        .footer { margin-top: 20px; font-size: 0.8em; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <div class="badge">경남교육감 출마예정자</div>
            <img src="https://i.namu.wiki/i/LRkAzYUguwmvoGirz9HOxQrkfYeCdQ6xm3QMo5D2gwB31NQxTVJ5Nik7Bb1QxIgj6Bo5JtSxvqlJPEPyVoryyo7vTeXQXx9pX7KG03RjyU7ScfUaDrL-h2MAtc-2KayeYJ23euODNenZm2IRKISHaw.webp" class="kim-img">
            <h1>경남 교육의 기분 좋은 변화<br><span>김영곤</span>의 럭키박스</h1>
            <p style="color:#666;">우리 아이를 위한 행운의 공약,<br>지금 바로 확인해보세요!</p>
            <button class="btn" onclick="startGame()">럭키박스 열기 🎁</button>
        </div>

        <div id="game-screen">
            <p style="font-weight: bold;">상자를 터치하면<br>공약 카드가 나타납니다!</p>
            <div class="lucky-box" onclick="showResult()"></div>
        </div>

        <div id="result-area">
            <h2 id="resTitle" style="color:var(--main-color);"></h2>
            <p id="resMsg" style="font-size: 1.1em; font-weight: bold;"></p>
            <div id="resPolicy" style="background:#f9f9f9; padding:15px; border-radius:10px; font-size:0.95em; text-align:left; line-height:1.6; border-left:4px solid var(--main-color);"></div>
            <button class="btn" onclick="location.reload()">다시 뽑기</button>
        </div>

        <div class="footer">
            미래를 여는 경남교육, 김영곤이 함께합니다.
        </div>
    </div>

    <script>
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
        }

        function showResult() {
            const outcomes = [
                { title: "🍀 AI 교육 행운", msg: "디지털 미래를 선점할 운세!", policy: "<strong>김영곤의 약속:</strong> [AI 영재교육원 건립]을 통해 경남의 아이들을 미래 산업의 주인공으로 키우겠습니다." },
                { title: "📈 학력 신장 행운", msg: "실력이 쑥쑥 자라나는 행운!", policy: "<strong>김영곤의 약속:</strong> [기초학력 전담 시스템 구축]으로 모든 아이가 공부에 자신감을 갖는 경남을 만들겠습니다." },
                { title: "🏫 안전 학교 행운", msg: "아이도 부모님도 안심하는 행운!", policy: "<strong>김영곤의 약속:</strong> [학교 안전망 강화] 및 [늘봄학교 내실화]를 통해 촘촘한 책임 교육을 실현하겠습니다." }
            ];
            const pick = outcomes[Math.floor(Math.random() * outcomes.length)];
            document.getElementById('resTitle').innerText = pick.title;
            document.getElementById('resMsg').innerText = pick.msg;
            document.getElementById('resPolicy').innerHTML = pick.policy;
            
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        }
    </script>
</body>
</html>
