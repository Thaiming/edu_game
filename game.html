<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 경남 교육 럭키박스</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            background: #e0f2f7; /* 하늘색 배경 */
        }
        .container {
            background: #fff; border-radius: 20px; padding: 30px;
            width: 90%; max-width: 500px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #007bff;
        }
        .kim-img {
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid #007bff; margin-bottom: 15px;
            object-fit: cover; /* 이미지가 찌그러지지 않게 설정 */
            background: #fff;
        }
        h1 { font-size: 1.6em; color: #333; margin: 10px 0; }
        .lucky-box {
            width: 140px; height: 140px; background: linear-gradient(145deg, #ffc107, #ff9800);
            border-radius: 20px; margin: 30px auto;
            display: flex; justify-content: center; align-items: center;
            font-size: 4em; cursor: pointer;
            box-shadow: 0 8px 15px rgba(255,152,0,0.3);
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .result-area {
            display: none; background: #f8fdff; border-radius: 15px;
            padding: 25px; margin-top: 20px; border: 2px dashed #007bff;
            text-align: center;
        }
        .btn {
            background: #007bff; color: white; border: none;
            padding: 12px 25px; border-radius: 8px; cursor: pointer;
            margin-top: 20px; font-weight: bold; font-size: 1em;
        }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.namu.wiki/i/LRkAzYUguwmvoGirz9HOxQrkfYeCdQ6xm3QMo5D2gwB31NQxTVJ5Nik7Bb1QxIgj6Bo5JtSxvqlJPEPyVoryyo7vTeXQXx9pX7KG03RjyU7ScfUaDrL-h2MAtc-2KayeYJ23euODNenZm2IRKISHaw.webp" 
             alt="김영곤 후보" class="kim-img">
        
        <h1>2026 경남 교육 럭키박스</h1>
        <p>박스를 클릭해 우리 아이의 <br><strong>행운 공약</strong>을 확인하세요!</p>

        <div class="lucky-box" id="luckyBox">🎁</div>

        <div class="result-area" id="resultArea">
            <h2 id="resTitle" style="color:#007bff; margin-bottom:10px;"></h2>
            <p id="resMsg" style="font-size: 1.2em; font-weight: bold; margin-bottom:15px; color:#333;"></p>
            <p id="resPolicy" style="color:#666; font-size: 0.95em; line-height:1.5; background:#fff; padding:10px; border-radius:8px;"></p>
            <button class="btn" onclick="location.reload()">다시 뽑기</button>
        </div>
    </div>

    <script>
        const luckyBox = document.getElementById('luckyBox');
        const resultArea = document.getElementById('resultArea');
        const outcomes = [
            { title: "🍀 AI 영재운", msg: "아이의 잠재력이 폭발할 운세!", policy: "김영곤은 [AI 영재교육원 신설]로 경남의 아이들을 글로벌 인재로 키우겠습니다." },
            { title: "📈 학력 점프운", msg: "성적이 쑥쑥 올라가는 기분 좋은 예감!", policy: "김영곤은 [기초학력 보장 및 학력 격차 해소]로 단 한 명의 아이도 포기하지 않습니다." },
            { title: "🚀 취업 탄탄운", msg: "지역 대기업 입사 각! 미래가 든든해집니다.", policy: "김영곤은 [지역 사업체 연계형 AI 인재 양성]으로 경남 청년의 일자리를 책임집니다." },
            { title: "💖 책임 교육운", msg: "학부모님 걱정 끝! 학교가 울타리가 됩니다.", policy: "김영곤은 [공교육 책임제]를 통해 교육 격차 없는 경남을 만들겠습니다." },
            { title: "🏫 명문 학교운", msg: "우리 동네에 특별한 학교가 생길 운세!", policy: "김영곤은 [자율형 사립고·영재고 등 다양한 교육 모델]을 과감히 도입하겠습니다." }
        ];

        luckyBox.onclick = function() {
            const pick = outcomes[Math.floor(Math.random() * outcomes.length)];
            document.getElementById('resTitle').innerText = pick.title;
            document.getElementById('resMsg').innerText = pick.msg;
            document.getElementById('resPolicy').innerText = pick.policy;
            
            luckyBox.style.display = 'none';
            resultArea.style.display = 'block';
        };
    </script>

</body>
</html>
