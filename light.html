<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>경남교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { background: #000; color: white; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #msg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); pointer-events: none; z-index: 200; }
        #text-box { width: 85%; text-align: center; font-size: 1.4rem; font-weight: bold; line-height: 1.6; text-shadow: 0 0 20px #000; }
        .sub-msg { font-size: 0.9rem; color: var(--gold); margin-top: 20px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #v-hp-container { position: absolute; top: env(safe-area-inset-top, 30px); left: 50%; transform: translateX(-50%); width: 70%; height: 15px; border: 1px solid #fff; background: #333; border-radius: 10px; overflow: hidden; display: none; z-index: 100; }
        #v-hp-fill { height: 100%; background: var(--danger); width: 100%; transition: 0.1s; }
        .damage { position: absolute; color: var(--gold); font-weight: 900; font-size: 2.2rem; animation: hit 0.4s ease-out forwards; pointer-events: none; z-index: 300; text-shadow: 2px 2px 5px #000; }
        @keyframes hit { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="msg-overlay">
        <div id="text-box">경남교육의 미래를 위해<br>화면을 터치하세요!</div>
        <div id="sub-hint" class="sub-msg">[ TOUCH ]</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const textEl = document.getElementById('text-box');
    const hintEl = document.getElementById('sub-hint');
    const hpContainer = document.getElementById('v-hp-container');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');

    // --- [중요] 파일명 확인: ygk.png 또는 yhk.png로 맞춰주세요 ---
    const HERO_IMG_SRC = 'ygk.png'; 

    const imgHero = new Image(); imgHero.src = HERO_IMG_SRC;
    const imgV1 = new Image(); imgV1.src = 'v1.png';
    const imgV2 = new Image(); imgV2.src = 'v2.png';
    const imgV3 = new Image(); imgV3.src = 'v3.png';

    let state = 'INTRO', step = 0, stage = 0, hp = 100, shake = 0;
    let canvasW, canvasH;

    const story = [
        "경남교육의 심장부가 멈췄습니다.",
        "낡은 관성이 아이들의 미래를 가리고 있습니다.",
        "김영곤: \"경남의 미래, 교육으로 다시 깨우겠습니다!\"",
        "전투 개시! 빌런을 연타하여 정화하세요!"
    ];

    const villains = [
        { name: "격차의 마녀", img: imgV1, policy: "경남형 기회균등 완성!" },
        { name: "획일화 거인", img: imgV2, policy: "맞춤형 개성 교육!" },
        { name: "관성 대마왕", img: imgV3, policy: "경남교육 혁신 성공!" }
    ];

    function resize() {
        canvasW = window.innerWidth; canvasH = window.innerHeight;
        canvas.width = canvasW; canvas.height = canvasH;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.clearRect(0, 0, canvasW, canvasH);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            const vw = canvasW * 0.45; const vh = vw * 1.3;
            const hw = canvasW * 0.45; const hh = hw * 1.5;
            
            // 왼쪽: 빌런 (이미지 로드 완료 확인 후 그리기)
            if(villains[stage].img.complete) {
                ctx.drawImage(villains[stage].img, (canvasW * 0.05) + sx, (canvasH * 0.35) + sy, vw, vh);
            } else {
                ctx.fillStyle = "red"; ctx.fillRect((canvasW * 0.05) + sx, (canvasH * 0.35) + sy, vw, vh);
            }

            // 오른쪽: 김영곤 후보님 (이미지 로드 완료 확인 후 그리기)
            if(imgHero.complete) {
                ctx.drawImage(imgHero, (canvasW * 0.5) + sx, (canvasH * 0.45) + sy, hw, hh);
            } else {
                ctx.fillStyle = "blue"; ctx.fillRect((canvasW * 0.5) + sx, (canvasH * 0.45) + sy, hw, hh);
            }
        }
        requestAnimationFrame(draw);
    }

    function handleInput(e) {
        if (state === 'INTRO') {
            if (step < story.length - 1) {
                step++;
                textEl.innerHTML = story[step];
            } else {
                state = 'PLAY';
                textEl.innerText = "";
                hintEl.style.display = "none";
                hpContainer.style.display = "block";
            }
        } else if (state === 'PLAY') {
            attack(e);
        }
    }

    function attack(e) {
        hp -= 10; shake = 15;
        hpFill.style.width = hp + "%";
        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "경남교육!";
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        const r = container.getBoundingClientRect();
        dam.style.left = (cx - r.left - 40) + 'px';
        dam.style.top = (cy - r.top - 40) + 'px';
        container.appendChild(dam);
        setTimeout(() => dam.remove(), 400);

        if (hp <= 0) {
            alert(`정화 성공: ${villains[stage].policy}`);
            stage++;
            if (stage >= 3) {
                state = 'ENDING';
                textEl.innerHTML = "<span style='color:var(--gold);'>경남교육 승리!<br>김영곤이 해냈습니다!</span>";
                hpContainer.style.display = "none";
            } else { hp = 100; hpFill.style.width = "100%"; }
        }
    }

    container.onmousedown = (e) => handleInput(e);
    container.ontouchstart = (e) => { e.preventDefault(); handleInput(e); };

    draw();
</script>
</body>
</html>
