<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>경남교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        body { 
            background: #000; color: white; margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; overflow: hidden; touch-action: none;
        }
        
        #game-container { 
            position: relative; width: 100%; height: 100%; 
            background: linear-gradient(180deg, #0f172a 0%, #000 100%); 
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* 중앙 메시지 가독성 강화 */
        #msg-center { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; text-align: center; font-size: 1.4rem; font-weight: bold;
            text-shadow: 0 0 15px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,1);
            pointer-events: none; z-index: 200; line-height: 1.6; color: #fff;
        }

        /* 상단 UI 레이아웃 (노치 대응) */
        #ui-layer {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 0; width: 100%;
            padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
            pointer-events: none; z-index: 150;
        }

        #v-hp-container { 
            width: 80%; height: 18px; border: 2px solid #fff; background: #333; 
            border-radius: 10px; overflow: hidden; display: none;
        }
        #v-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); width: 100%; transition: 0.1s; }
        
        .name-tag { 
            position: absolute; padding: 5px 12px; border-radius: 6px; font-size: 0.9rem; 
            font-weight: bold; display: none; border: 1.5px solid #fff; z-index: 150;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* 타격 효과 텍스트 */
        .damage { 
            position: absolute; color: var(--gold); font-weight: 900; font-size: 2.2rem; 
            animation: hitEffect 0.4s ease-out forwards; pointer-events: none; z-index: 300;
            text-shadow: 2px 2px 0px #000;
        }
        @keyframes hitEffect { 0% { opacity: 1; transform: scale(0.8) rotate(-10deg); } 50% { transform: scale(1.3) rotate(10deg); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    </div>

    <div id="msg-center">경남교육의 미래를 가로막는<br>낡은 관성을 깨부수자!<br><br><span style="font-size: 0.9rem; color: var(--gold);">[ 화면을 터치하세요 ]</span></div>
    
    <div id="tag-hero" class="name-tag" style="background:var(--hero)">김영곤 후보</div>
    <div id="tag-villain" class="name-tag" style="background:var(--danger)">관성 빌런</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const hpContainer = document.getElementById('v-hp-container');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');

    // 이미지 객체
    const imgHero = new Image(); imgHero.src = 'ygk.png';
    const imgV1 = new Image(); imgV1.src = 'v1.png';
    const imgV2 = new Image(); imgV2.src = 'v2.png';
    const imgV3 = new Image(); imgV3.src = 'v3.png';

    let state = 'INTRO', step = 0, stage = 0, hp = 100, shake = 0;
    let canvasW, canvasH;

    const story = [
        "경남교육의 심장부가 멈췄습니다.",
        "낡은 관성이 아이들의 미래를 가리고 있습니다.",
        "김영곤: \"경남의 미래, 교육으로 다시 깨우겠습니다!\"",
        "전투 개시! 빌런을 연타하세요!"
    ];

    const villains = [
        { name: "격차의 마녀", img: imgV1, policy: "경남형 기회균등 완성!" },
        { name: "획일화 거인", img: imgV2, policy: "맞춤형 개성 교육!" },
        { name: "관성 대마왕", img: imgV3, policy: "경남교육 혁신 성공!" }
    ];

    // 화면 크기 최적화 함수
    function resize() {
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        canvas.width = canvasW;
        canvas.height = canvasH;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.clearRect(0, 0, canvasW, canvasH);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            // 빌런 (왼쪽 하단 중심)
            const vw = canvasW * 0.45;
            const vh = vw * 1.3;
            ctx.drawImage(villains[stage].img, (canvasW * 0.05) + sx, (canvasH * 0.35) + sy, vw, vh);
            updateTag('tag-villain', (canvasW * 0.1) + sx, (canvasH * 0.32) + sy, villains[stage].name);

            // 후보님 (오른쪽 하단 중심)
            const hw = canvasW * 0.45;
            const hh = hw * 1.5;
            ctx.drawImage(imgHero, (canvasW * 0.5) + sx, (canvasH * 0.45) + sy, hw, hh);
            updateTag('tag-hero', (canvasW * 0.55) + sx, (canvasH * 0.42) + sy, "김영곤 후보");
        }
        requestAnimationFrame(draw);
    }

    function updateTag(id, x, y, name) {
        const tag = document.getElementById(id);
        tag.innerText = name;
        tag.style.left = x + 'px';
        tag.style.top = y + 'px';
    }

    function handleInteraction(e) {
        if (state === 'INTRO') {
            step++;
            if (step < story.length) {
                msgEl.innerHTML = story[step];
            } else {
                state = 'PLAY';
                msgEl.innerText = "";
                hpContainer.style.display = "block";
                document.querySelectorAll('.name-tag').forEach(t => t.style.display = 'block');
            }
            return;
        }
        if (state === 'PLAY') attack(e);
    }

    function attack(e) {
        hp -= 7;
        shake = 15;
        hpFill.style.width = hp + "%";

        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "경남교육!";
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
