<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교육 히어로: 잃어버린 미래를 찾아서</title>
    <style>
        :root { --main-blue: #0056b3; --gold: #ffd700; --danger: #ff4757; }
        body { background: #0f172a; color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        /* 게임 화면 테두리 및 그림자 */
        #game-container { 
            position: relative; width: 800px; height: 450px; 
            border: 6px solid var(--gold); border-radius: 20px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.5), 0 0 20px rgba(255, 215, 0, 0.2);
            overflow: hidden;
        }

        /* UI 레이아웃 개선 */
        #top-ui { 
            position: absolute; top: 20px; left: 0; width: 100%; 
            display: flex; justify-content: space-around; align-items: flex-start;
        }
        .hp-container { width: 250px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 10px; border: 1px solid #444; }
        .hp-bar { height: 15px; background: var(--danger); width: 100%; border-radius: 5px; transition: 0.3s; }
        
        #msg-center { 
            position: absolute; bottom: 100px; width: 100%; text-align: center;
            font-size: 1.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* 정책 카드 슬롯 스타일 */
        #policy-cards {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px;
        }
        .card { 
            width: 120px; height: 60px; background: rgba(255,215,0,0.1); 
            border: 2px solid var(--gold); border-radius: 5px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; text-align: center; font-weight: bold; opacity: 0.3;
        }
        .card.active { opacity: 1; background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="top-ui">
        <div class="hp-container">
            <div style="font-size: 0.7rem; margin-bottom: 3px;">HERO 김영곤</div>
            <div class="hp-bar" style="background: #2ed573;"></div>
        </div>
        <div class="hp-container">
            <div id="villain-name" style="font-size: 0.7rem; margin-bottom: 3px; text-align: right;">대기 중...</div>
            <div id="villain-hp" class="hp-bar"></div>
        </div>
    </div>

    <div id="msg-center">화면을 클릭하여 시작하세요</div>

    <div id="policy-cards">
        <div id="card1" class="card">기회균등<br>어퍼컷</div>
        <div id="card2" class="card">개성해방<br>소닉붐</div>
        <div id="card3" class="card">미래교육<br>그랜드슬램</div>
    </div>
</div>

<script>
    // 기존 로직을 유지하되 비주얼 업데이트 (애니메이션 효과 추가 가능)
    // (이전 코드의 핵심 로직을 그대로 넣되, UI 요소를 조작하는 코드로 연결)
</script>
</body>
</html>
