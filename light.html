<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>경남교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        body { background: #000; color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* 반응형 컨테이너: 모바일에서 꽉 차게 설정 */
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            max-width: 500px; max-height: 900px; /* 모바일 세로 비율 최적화 */
            background: #111; overflow: hidden; border: 2px solid var(--gold); 
        }

        canvas { width: 100%; height: 100%; object-fit: contain; }

        #msg-center { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; text-align: center; font-size: 1.2rem; font-weight: bold;
            text-shadow: 2px 2px 10px #000; pointer-events: none; z-index: 200; line-height: 1.6;
        }

        #v-hp-container { 
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%); 
            width: 70%; height: 15px; border: 1px solid #fff; background: #333; display: none; 
        }
        #v-hp-fill { height: 100%; background: var(--danger); width: 100%; transition: 0.1s; }
        
        .name-tag { 
            position: absolute; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; 
            font-weight: bold; display: none; border: 1px solid #fff; z-index: 150;
        }
        
        .damage { position: absolute; color: var(--gold); font-weight: bold; font-size: 1.8rem; animation: hit 0.4s ease-out forwards; pointer-events: none; z-index: 300; }
        @keyframes hit { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.3); } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="500" height="800"></canvas>
    <div id="msg-center">멈춰버린 경남교육의 시계탑...<br>화면을 터치하여 미래를 찾으세요!</div>
    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="tag-hero" class="name-tag" style="background:var(--hero)">김영곤 후보</div>
    <div id="tag-villain" class="name-tag" style="background:var(--danger)">빌런</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const hpContainer = document.getElementById('v-hp-container');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');

    // 이미지 로드
    const imgHero = new Image(); imgHero.src = 'ygk.png';
    const imgV1 = new Image(); imgV1.src = 'v1.png';
    const imgV2 = new Image(); imgV2.src = 'v2.png';
    const imgV3 = new Image(); imgV3.src = 'v3.png';

    let state = 'INTRO', step = 0, stage = 0, hp = 100, shake = 0;
    
    const story = [
        "경남교육의 심장부가 멈췄습니다.",
        "낡은 관성이 아이들의 미래를 가리고 있습니다.",
        "김영곤: \"경남의 미래, 교육으로 다시 깨우겠습니다!\"",
        "전투 개시! 빌런을 연타하여 정화하세요!"
    ];

    const villains = [
        { name: "격차의 마녀", img: imgV1, policy: "경남형 기회균등 완성!" },
        { name: "획일화 거인", img: imgV2, policy: "맞춤형 개성 교육 실시!" },
        { name: "관성 대마왕", img: imgV3, policy: "경남교육 혁신 대성공!" }
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            // 빌런 위치: 왼쪽 (방어자)
            ctx.drawImage(villains[stage].img, 50 + sx, 200 + sy, 180, 250);
            updateTag('tag-villain', 50 + sx, 160 + sy);

            // 후보님 위치: 오른쪽 (공격자)
            ctx.drawImage(imgHero, 280 + sx, 250 + sy, 150, 220);
            updateTag('tag-hero', 280 + sx, 210 + sy);
        }
        requestAnimationFrame(draw);
    }

    function updateTag(id, x, y) {
        const tag = document.getElementById(id);
        tag.style.left = x + 'px';
        tag.style.top = y + 'px';
    }

    function handleInteraction(e) {
        if (state === 'INTRO') {
            step++;
            if (step < story.length) {
                msgEl.innerHTML = story[step];
            } else {
                state = 'PLAY';
                msgEl.innerText = "";
                hpContainer.style.display = "block";
                document.querySelectorAll('.name-tag').forEach(t => t.style.display = 'block');
            }
            return;
        }
        if (state === 'PLAY') attack(e);
    }

    function attack(e) {
        hp -= 8;
        shake = 12;
        hpFill.style.width = hp + "%";

        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "경남교육!";
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = container.getBoundingClientRect();
        
        dam.style.left = (clientX - rect.left - 20) + 'px';
        dam.style.top = (clientY - rect.top - 20) + 'px';
        container.appendChild(dam);
        setTimeout(() => dam.remove(), 400);

        if (hp <= 0) {
            alert(`[${villains[stage].policy}]`);
            stage++;
            if (stage >= 3) {
                state = 'ENDING';
                msgEl.innerHTML = "<span style='color:var(--gold)'>경남교육의 승리!</span><br><br>김영곤 후보가 경남의 미래를 구했습니다.";
                hpContainer.style.display = "none";
                document.querySelectorAll('.name-tag').forEach(t => t.style.display = 'none');
            } else {
                hp = 100; hpFill.style.width = "100%";
            }
        }
    }

    container.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, { passive: false });
    container.
