<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        body { background: #000; color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        #game-container { position: relative; width: 100%; max-width: 800px; height: 450px; background: #111; overflow: hidden; border: 3px solid var(--gold); border-radius: 15px; }

        /* 데미지 텍스트 */
        .damage { position: absolute; color: var(--gold); font-weight: bold; font-size: 2rem; animation: hitAnime 0.4s ease-out forwards; pointer-events: none; z-index: 100; }
        @keyframes hitAnime { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        #msg-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; text-align: center; font-size: 1.4rem; font-weight: bold; text-shadow: 2px 2px 10px #000; pointer-events: none; z-index: 200; }

        #v-hp-container { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 60%; height: 15px; border: 1px solid #fff; background: #333; display: none; }
        #v-hp-fill { height: 100%; background: var(--danger); width: 100%; transition: 0.1s; }
        
        .name-tag { position: absolute; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: none; border: 1px solid #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="msg-center">대한민국의 미래를 위해<br>화면을 터치하세요</div>
    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="tag-hero" class="name-tag" style="background:var(--hero)">김영곤 후보</div>
    <div id="tag-villain" class="name-tag" style="background:var(--danger)">빌런</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const hpContainer = document.getElementById('v-hp-container');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');

    const imgHero = new Image(); imgHero.src = 'ygk.png';
    const imgV1 = new Image(); imgV1.src = 'v1.png';
    const imgV2 = new Image(); imgV2.src = 'v2.png';
    const imgV3 = new Image(); imgV3.src = 'v3.png';

    let state = 'INTRO', stage = 0, hp = 100, shake = 0;
    const villains = [
        { name: "격차의 마녀", img: imgV1, policy: "기회균등 실현!" },
        { name: "획일화 거인", img: imgV2, policy: "개성 존중 교육!" },
        { name: "관성 대마왕", img: imgV3, policy: "미래 교육 완성!" }
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            ctx.drawImage(imgHero, 100 + sx, 200 + sy, 120, 180);
            ctx.drawImage(villains[stage].img, 500 + sx, 150 + sy, 180, 230);
        }
        requestAnimationFrame(draw);
    }

    // 터치/클릭 통합 핸들러
    function handleInteraction(e) {
        if (state === 'INTRO') {
            state = 'PLAY';
            msgEl.innerText = "";
            hpContainer.style.display = "block";
            document.querySelectorAll('.name-tag').forEach(t => t.style.display = 'block');
            return;
        }

        if (state === 'PLAY') {
            attack(e);
        }
    }

    function attack(e) {
        hp -= 10;
        shake = 10;
        hpFill.style.width = hp + "%";

        // 데미지 효과
        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "참교육!";
        
        // 터치/클릭 좌표 구하기
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const rect = container.getBoundingClientRect();
        dam.style.left = (clientX - rect.left - 30) + 'px';
        dam.style.top = (clientY - rect.top - 30) + 'px';
        container.appendChild(dam);
        setTimeout(() => dam.remove(), 400);

        if (hp <= 0) {
            alert(`[${villains[stage].policy}] 정책 성공!`);
            stage++;
            if (stage >= 3) {
                state = 'ENDING';
                msgEl.innerHTML = "<span style='color:var(--gold)'>교육 히어로 김영곤!<br>미래를 되찾았습니다.</span>";
                hpContainer.style.display = "none";
            } else {
                hp = 100; hpFill.style.width = "100%";
            }
        }
    }

    // 모바일 전용 이벤트
    container.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        handleInteraction(e);
    }, { passive: false });

    // PC 전용 이벤트
    container.addEventListener('mousedown', (e) => {
        handleInteraction(e);
    });

    draw();
</script>
</body>
</html>
