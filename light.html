<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        body { background: #000; color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        
        #game-container { position: relative; width: 100%; max-width: 800px; height: 450px; background: url('bg_office.png') center/cover #111; overflow: hidden; border: 4px solid var(--gold); border-radius: 15px; }

        .name-tag { position: absolute; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; z-index: 50; border: 1px solid #fff; }
        .hero-tag { background: var(--hero); }
        .villain-tag { background: var(--danger); }

        /* 데미지 텍스트 */
        .damage { position: absolute; color: var(--gold); font-weight: bold; font-size: 2rem; animation: hitAnime 0.4s ease-out forwards; pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000; }
        @keyframes hitAnime { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        #v-hp-container { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 60%; height: 20px; border: 2px solid #fff; background: #333; border-radius: 10px; overflow: hidden; }
        #v-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); width: 100%; transition: 0.1s; }
        #msg-center { position: absolute; top: 150px; width: 100%; text-align: center; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 10px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container" id="gameBox">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="tag-hero" class="name-tag hero-tag">김영곤 후보</div>
    <div id="tag-villain" class="name-tag villain-tag">빌런</div>

    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="msg-center">화면을 클릭하여<br>참교육을 시작하세요!</div>
</div>
