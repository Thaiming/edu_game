<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        body { background: #000; color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        
        #game-container { position: relative; width: 100%; max-width: 800px; height: 450px; background: url('bg_office.png') center/cover #111; overflow: hidden; border: 4px solid var(--gold); border-radius: 15px; }

        .name-tag { position: absolute; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; z-index: 50; border: 1px solid #fff; }
        .hero-tag { background: var(--hero); }
        .villain-tag { background: var(--danger); }

        /* 데미지 텍스트 */
        .damage { position: absolute; color: var(--gold); font-weight: bold; font-size: 2rem; animation: hitAnime 0.4s ease-out forwards; pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000; }
        @keyframes hitAnime { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        #v-hp-container { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 60%; height: 20px; border: 2px solid #fff; background: #333; border-radius: 10px; overflow: hidden; }
        #v-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); width: 100%; transition: 0.1s; }
        #msg-center { position: absolute; top: 150px; width: 100%; text-align: center; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 10px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container" id="gameBox">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="tag-hero" class="name-tag hero-tag">김영곤 후보</div>
    <div id="tag-villain" class="name-tag villain-tag">빌런</div>

    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="msg-center">화면을 클릭하여<br>참교육을 시작하세요!</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');
    const tagHero = document.getElementById('tag-hero');
    const tagVillain = document.getElementById('tag-villain');

    // 이미지 객체 생성
    const imgHero = new Image(); imgHero.src = 'ygk.png'; 
    const imgV1 = new Image(); imgV1.src = 'v1.png'; // 격차의 마녀
    const imgV2 = new Image(); imgV2.src = 'v2.png'; // 획일화 거인
    const imgV3 = new Image(); imgV3.src = 'v3.png'; // 관성 대마왕

    let state = 'INTRO', stage = 0, hp = 100, shake = 0;

    const villains = [
        { name: "격차의 마녀 '디바이드'", img: imgV1, policy: "기회균등 실현!" },
        { name: "획일화 거인 '모노'", img: imgV2, policy: "개성 존중 교육!" },
        { name: "관성 대마왕 '올드원'", img: imgV3, policy: "미래 교육 완성!" }
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            // 후보님 그리기 (ygk.png)
            const hx = 100 + sx, hy = 200 + sy;
            ctx.drawImage(imgHero, hx, hy, 120, 180); 
            tagHero.style.left = (hx + 10) + 'px';
            tagHero.style.top = (hy - 40) + 'px';

            // 빌런 그리기
            const vx = 500 + sx, vy = 150 + sy;
            ctx.drawImage(villains[stage].img, vx, vy, 180, 230);
            tagVillain.innerText = villains[stage].name;
            tagVillain.style.left = (vx + 20) + 'px';
            tagVillain.style.top = (vy - 40) + 'px';
        }
        requestAnimationFrame(draw);
    }

    function attack(e) {
        if (state === 'INTRO') { state = 'PLAY'; msgEl.innerText = ""; return; }
        if (state !== 'PLAY') return;

        hp -= 8;
        shake = 15;
        hpFill.style.width = Math.max(0, hp) + "%";

        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "참교육!";
        const clickX = e.clientX || (e.touches ? e.touches[0].clientX : 400);
        const clickY = e.clientY || (e.touches ? e.touches[0].clientY : 200);
        dam.style.left = (clickX - 40) + 'px'; dam.style.top = (clickY - 40) + 'px';
        container.appendChild(dam);
        setTimeout(() => dam.remove(), 400);

        if (hp <= 0) {
            alert(`[${villains[stage].policy}] 정책 실행!`);
            stage++;
            if (stage >= 3) {
                state = 'ENDING';
                tagHero.style.display = tagVillain.style.display = "none";
                msgEl.innerHTML = "<span style='color:var(--gold); font-size:1.8rem;'>교육 히어로 김영곤,<br>대한민국의 미래를 열었습니다!</span>";
                hpFill.parentElement.style.display = "none";
            } else {
                hp = 100; hpFill.style.width = "100%";
            }
        }
    }

    container.addEventListener('touchstart', (e) => { e.preventDefault(); attack(e); });
    container.addEventListener('mousedown', (e) => attack(e));

    draw();
</script>
</body>
</html>
