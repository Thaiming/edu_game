<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교육 히어로: 잃어버린 미래를 찾아서</title>
    <style>
        body { background: #111; color: white; margin: 0; font-family: 'Pretendard', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #game-container { position: relative; width: 800px; height: 450px; border: 4px solid #ffd700; background: #222; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        .msg-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; font-size: 1.1rem; border: 1px solid #ffd700; line-height: 1.5; }
        #gauge-wrapper { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 400px; }
        #gauge-container { height: 15px; border: 2px solid #fff; background: #333; }
        #gauge-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd700, #fff); transition: width 0.1s; }
        .label { font-size: 0.8rem; margin-bottom: 5px; color: #ffd700; text-align: center; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="ui">
            <div id="msg" class="msg-box">클릭하여 미래를 찾는 여정을 시작하세요</div>
        </div>
        <div id="gauge-wrapper">
            <div class="label">정책 실행 에너지</div>
            <div id="gauge-container"><div id="gauge-bar"></div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const msgEl = document.getElementById('msg');
        const gaugeBar = document.getElementById('gauge-bar');

        let state = 'INTRO';
        let step = 0;
        let stageIdx = 0;
        let bossHP = 100;

        const story = [
            "대한민국 교육의 '희망의 시계탑'이 멈췄습니다.",
            "차별과 낡은 관성이 아이들의 미래를 흑백으로 만들었습니다.",
            "김영곤: \"더 이상 아이들의 꿈이 갇혀있게 두지 않겠습니다.\"",
            "이제 낡은 벽을 허물고, 잃어버린 미래를 되찾으러 갑니다!"
        ];

        const stages = [
            { name: "격차의 마녀 '디바이드'", boss: "부모 재력이 곧 실력이다!", skill: "기회균등 어퍼컷", color: "#e74c3c" },
            { name: "획일화의 거인 '모노'", boss: "전부 똑같은 것만 배워라!", skill: "개성해방 소닉붐", color: "#95a5a6" },
            { name: "관성의 대마왕 '올드원'", boss: "바꿔봐야 소용없다!", skill: "미래교육 그랜드 슬램", color: "#2c3e50" }
        ];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state === 'INTRO') {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                msgEl.innerText = story[step];
            } 
            else if (state === 'PLAY') {
                const s = stages[stageIdx];
                // 배경 (스테이지별 색상 변화)
                ctx.fillStyle = "#222";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 후보님 캐릭터
                ctx.fillStyle = "#3498db";
                ctx.fillRect(100, 250, 60, 100); 
                ctx.fillStyle = "white";
                ctx.fillText("김영곤 후보", 100, 240);

                // 빌런
                ctx.fillStyle = s.color;
                ctx.fillRect(600, 200, 100, 150);
                ctx.fillStyle = "white";
                ctx.fillText(s.name, 600, 180);
                ctx.fillText(`HP: ${bossHP}`, 630, 370);

                msgEl.innerText = `[Stage ${stageIdx+1}] ${s.name}: "${s.boss}" \n (A키를 연타하여 정책을 실행하세요!)`;
            }
            else if (state === 'ENDING') {
                ctx.fillStyle = "#ffd700";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#000";
                ctx.textAlign = "center";
                ctx.font = "bold 25px Arial";
                ctx.fillText("미래 교육의 문이 열렸습니다!", canvas.width/2, 200);
                ctx.font = "18px Arial";
                ctx.fillText("\"우리 아이들의 가능성, 김영곤이 지키겠습니다.\"", canvas.width/2, 250);
                msgEl.innerText = "게임 클리어! 아이들의 웃음소리가 다시 들려옵니다.";
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('mousedown', () => {
            if (state === 'INTRO') {
                step++;
                if (step >= story.length) {
                    state = 'PLAY';
                    bossHP = stages[stageIdx].hp || 100;
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (state === 'PLAY' && e.key.toLowerCase() === 'a') {
                bossHP -= 10;
                let currentGauge = (1 - (bossHP / 100)) * 100;
                gaugeBar.style.width = currentGauge + "%";

                if (bossHP <= 0) {
                    alert(`정화 성공! [${stages[stageIdx].skill}] 발동!`);
                    stageIdx++;
                    bossHP = 100;
                    gaugeBar.style.width = "0%";
                    if (stageIdx >= stages.length) state = 'ENDING';
                }
            }
        });

        draw();
    </script>
</body>
</html>
