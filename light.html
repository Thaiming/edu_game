<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>경남교육 히어로: 김영곤</title>
    <style>
        :root { --danger: #ff4757; --gold: #ffd700; --hero: #007bff; }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        body { 
            background: #000; color: white; margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; overflow: hidden; touch-action: none;
        }
        
        #game-container { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        #msg-center { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); 
            width: 85%; text-align: center; font-size: 1.4rem; font-weight: bold;
            text-shadow: 0 0 15px #000; pointer-events: none; z-index: 200; line-height: 1.6;
        }

        #v-hp-container { 
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            width: 70%; height: 15px; border: 2px solid #fff; background: #333; 
            border-radius: 10px; overflow: hidden; display: none; z-index: 100;
        }
        #v-hp-fill { height: 100%; background: var(--danger); width: 100%; transition: 0.1s; }
        
        .name-tag { 
            position: absolute; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; 
            font-weight: bold; display: none; border: 1px solid #fff; z-index: 150;
        }

        .damage { position: absolute; color: var(--gold); font-weight: 900; font-size: 2rem; animation: hit 0.4s ease-out forwards; pointer-events: none; z-index: 300; }
        @keyframes hit { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="v-hp-container"><div id="v-hp-fill"></div></div>
    <div id="msg-center">경남교육의 미래를 위해<br>화면을 터치하세요!</div>
    <div id="tag-hero" class="name-tag" style="background:var(--hero)">김영곤 후보</div>
    <div id="tag-villain" class="name-tag" style="background:var(--danger)">빌런</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const hpContainer = document.getElementById('v-hp-container');
    const hpFill = document.getElementById('v-hp-fill');
    const container = document.getElementById('game-container');

    const imgHero = new Image(); imgHero.src = 'ygk.png';
    const imgV1 = new Image(); imgV1.src = 'v1.png';
    const imgV2 = new Image(); imgV2.src = 'v2.png';
    const imgV3 = new Image(); imgV3.src = 'v3.png';

    let state = 'INTRO', step = 0, stage = 0, hp = 100, shake = 0;
    let canvasW, canvasH;

    const story = [
        "경남교육의 심장부가 멈췄습니다.",
        "낡은 관성이 아이들의 미래를 가리고 있습니다.",
        "김영곤: \"경남의 미래, 교육으로 다시 깨우겠습니다!\"",
        "전투 개시! 빌런을 연타하세요!"
    ];

    const villains = [
        { name: "격차의 마녀", img: imgV1, policy: "경남형 기회균등 완성!" },
        { name: "획일화 거인", img: imgV2, policy: "맞춤형 개성 교육!" },
        { name: "관성 대마왕", img: imgV3, policy: "경남교육 혁신 성공!" }
    ];

    function resize() {
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        canvas.width = canvasW;
        canvas.height = canvasH;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.clearRect(0, 0, canvasW, canvasH);
        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        if (shake > 0) shake *= 0.8;

        if (state === 'PLAY') {
            const vw = canvasW * 0.45; const vh = vw * 1.3;
            ctx.drawImage(villains[stage].img, (canvasW * 0.05) + sx, (canvasH * 0.35) + sy, vw, vh);
            const hw = canvasW * 0.45; const hh = hw * 1.5;
            ctx.drawImage(imgHero, (canvasW * 0.5) + sx, (canvasH * 0.45) + sy, hw, hh);
        }
        requestAnimationFrame(draw);
    }

    // 터치/클릭 통합 실행기
    function handleInput(e) {
        if (state === 'INTRO') {
            if (step < story.length - 1) {
                step++;
                msgEl.innerHTML = story[step];
            } else {
                state = 'PLAY';
                msgEl.innerText = "";
                hpContainer.style.display = "block";
            }
        } else if (state === 'PLAY') {
            attack(e);
        }
    }

    function attack(e) {
        hp -= 10;
        shake = 15;
        hpFill.style.width = hp + "%";

        const dam = document.createElement('div');
        dam.className = 'damage'; dam.innerText = "경남교육!";
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        dam.style.left = (clientX - 50) + 'px';
        dam.style.top = (clientY - 50) + 'px';
        container.appendChild(dam);
        setTimeout(() => dam.remove(), 400);

        if (hp <= 0) {
            alert(`[${villains[stage].policy}]`);
            stage++;
            if (stage >= 3) {
                state = 'ENDING';
                msgEl.innerHTML = "<span style='color:var(--gold)'>경남교육의 승리!</span>";
                hpContainer.style.display = "none";
            } else {
                hp = 100; hpFill.style.width = "100%";
            }
        }
    }

    // 이벤트 리스너: 가장 확실한 방법으로 등록
    container.onclick = (e) => handleInput(e);
    container.ontouchstart = (e) => { e.preventDefault(); handleInput(e); };

    draw();
</script>
</body>
</html>
