<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교육 히어로: 김영곤</title>
    <style>
        :root { --gold: #ffd700; --blue: #007bff; --bg: #0a0e14; }
        body { background: var(--bg); color: white; margin: 0; font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        
        #game-container { 
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            border: 3px solid var(--gold); background: #111; overflow: hidden; border-radius: 15px;
        }

        #msg-center { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; text-align: center; font-size: 1.3rem; font-weight: bold;
            text-shadow: 2px 2px 8px #000; pointer-events: none; z-index: 100;
        }

        /* 정책 카드: 처음엔 숨김 */
        #policy-area {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; opacity: 0; transition: opacity 0.5s;
        }
        .policy-tag { 
            padding: 5px 12px; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); 
            border-radius: 20px; font-size: 0.8rem; color: var(--gold); display: none;
        }
        .active-tag { display: block; animation: pop 0.3s ease-out; }

        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        /* 모바일 공격 버튼 */
        #attack-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 80px; height: 80px; background: var(--gold);
            border-radius: 50%; border: 3px solid #fff; color: black; font-weight: bold;
            display: none; align-items: center; justify-content: center; font-size: 0.9rem;
            z-index: 110; -webkit-tap-highlight-color: transparent;
        }

        .hp-bar-container { position: absolute; top: 20px; width: 150px; height: 10px; background: #333; border: 1px solid #fff; display: none; }
        #v-hp-bar { right: 20px; }
        #hero-hp-bar { left: 20px; }
        .hp-fill { height: 100%; background: #ff4757; width: 100%; transition: 0.1s; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="hero-hp-bar" class="hp-bar-container"><div class="hp-fill" style="background: #2ed573;"></div></div>
    <div id="v-hp-bar" class="hp-bar-container"><div id="v-fill" class="hp-fill"></div></div>

    <div id="msg-center">대한민국 교육의 미래를 위해<br>화면을 클릭하세요</div>

    <div id="policy-area">
        <div id="tag0" class="policy-tag">● 기회균등 어퍼컷</div>
        <div id="tag1" class="policy-tag">● 개성해방 소닉붐</div>
        <div id="tag2" class="policy-tag">● 미래교육 그랜드슬램</div>
    </div>

    <div id="attack-btn">정책<br>실행</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg-center');
    const btnEl = document.getElementById('attack-btn');
    const policyArea = document.getElementById('policy-area');
    const vFill = document.getElementById('v-fill');

    let state = 'INTRO', step = 0, stage = 0, hp = 100;
    const story = [
        "멈춰버린 '희망의 시계탑'...",
        "김영곤 후보가 아이들의 미래를 찾으러 나섭니다.",
        "\"이제 낡은 관성의 벽을 깨부수겠습니다!\"",
        "전투 개시! 하단 버튼을 연타하세요!"
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (state === 'PLAY') {
            ctx.fillStyle = "#007bff"; ctx.fillRect(150, 250, 60, 100); // 후보님
            ctx.fillStyle = (stage==0)?"#e74c3c":(stage==1)?"#95a5a6":"#2c3e50"; 
            ctx.fillRect(550, 200, 100, 150); // 빌런
        }
        requestAnimationFrame(draw);
    }

    function handleIntro() {
        if (state === 'INTRO') {
            step++;
            if (step < story.length) msgEl.innerHTML = story[step];
            else { 
                state = 'PLAY'; msgEl.innerHTML = ""; 
                btnEl.style.display = "flex"; 
                policyArea.style.opacity = "1";
                document.querySelectorAll('.hp-bar-container').forEach(el => el.style.display = "block");
                unlockPolicy();
            }
        }
    }

    function unlockPolicy() {
        document.getElementById(`tag${stage}`).classList.add('active-tag');
    }

    function attack() {
        if (state !== 'PLAY') return;
        hp -= 10;
        vFill.style.width = hp + "%";
        if (hp <= 0) {
            stage++;
            if (stage < 3) {
                alert("빌런 정화 완료! 다음 정책이 해금되었습니다.");
                hp = 100; vFill.style.width = "100%";
                unlockPolicy();
            } else {
                state = 'ENDING';
                btnEl.style.display = "none";
                msgEl.innerHTML = "<span style='color:var(--gold); font-size:1.5rem;'>교육 혁신 성공!</span><br><br>시계탑이 다시 돌아갑니다.<br>김영곤이 약속을 지켰습니다.";
            }
        }
    }

    canvas.addEventListener('mousedown', handleIntro);
    btnEl.addEventListener('touchstart', (e) => { e.preventDefault(); attack(); });
    btnEl.addEventListener('mousedown', attack);
    window.addEventListener('keydown', (e) => { if(e.key.toLowerCase() === 'a') attack(); });

    draw();
</script>
</body>
</html>
