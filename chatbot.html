<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>김영곤 AI 대변인</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0052cc; --bg: #f8faff; --white: #ffffff; }
        body { font-family: 'Pretendard', sans-serif; background: #eef2f7; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 480px; background: white; display: flex; flex-direction: column; position: relative; }
        
        /* 헤더: 신뢰감 있는 디자인 */
        #header { padding: 20px; border-bottom: 1px solid #edf2f7; background: white; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        #header h1 { margin: 0; font-size: 1.25rem; color: var(--p); font-weight: 800; }
        #header p { margin: 5px 0 0; font-size: 0.85rem; color: #666; font-weight: 500; }

        /* 채팅 영역: 메시지 간격 조정 */
        #chat-win { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg { max-width: 88%; animation: slideUp 0.3s ease; }
        .bot-card { background: white; padding: 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,82,204,0.06); border-left: 6px solid var(--p); align-self: flex-start; }
        .user-msg { align-self: flex-end; background: var(--p); color: white; padding: 12px 18px; border-radius: 20px 20px 2px 20px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(0,82,204,0.15); }
        
        .p-title { font-weight: 700; color: var(--p); display: block; margin-bottom: 10px; font-size: 1.1rem; }
        .p-text { font-size: 0.98rem; line-height: 1.7; color: #333; word-break: keep-all; }
        .p-list { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; font-size: 0.9rem; color: #555; }
        .p-list b { color: var(--p); display: block; margin-bottom: 5px; }

        /* 입력 및 메뉴 영역 */
        #bottom-section { background: white; border-top: 1px solid #edf2f7; padding: 15px; }
        
        /* 추천 태그: 잘리지 않게 가로 스크롤 강화 */
        .tag-container { margin-bottom: 15px; }
        .tag-label { font-size: 0.75rem; color: #999; font-weight: 700; margin-bottom: 8px; display: block; padding-left: 5px; }
        .tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .tags::-webkit-scrollbar { display: none; }
        .tag { white-space: nowrap; padding: 9px 16px; background: #f0f6ff; color: var(--p); border-radius: 50px; font-size: 0.82rem; cursor: pointer; border: 1px solid #dbeafe; font-weight: 600; flex-shrink: 0; }
        .tag:active { background: var(--p); color: white; }

        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px 20px; border: 1px solid #e2e8f0; border-radius: 30px; outline: none; font-size: 1rem; background: #f8fafc; transition: 0.2s; }
        input:focus { border-color: var(--p); background: white; box-shadow: 0 0 0 4px rgba(0,82,204,0.08); }
        #send-btn { background: var(--p); color: white; border: none; padding: 0 25px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 0.95rem; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="app">
    <div id="header">
        <h1>김영곤 AI 대변인</h1>
        <p>아이의 하루를 책임지는 따뜻한 약속</p>
    </div>
    
    <div id="chat-win" id="chatWin">
        <div class="msg bot-card">
            반갑습니다! 😊 김영곤 후보의 AI 대변인입니다.<br><br>
            <b>"부모님은 사랑으로만 안아주십시오. 나머지는 저 김영곤이 책임지겠습니다."</b> [cite: 2, 3]<br><br>
            아래 추천 주제를 밀어서 확인하시거나, 궁금한 점을 편하게 말씀해 주세요!
        </div>
    </div>

    <div id="bottom-section">
        <div class="tag-container">
            <span class="tag-label">인기 주제 (옆으로 밀어보세요 👉)</span>
            <div class="tags">
                <div class="tag" onclick="handleTag('아침밥 정책 알려줘')">🍱 아침밥(온케어)</div>
                <div class="tag" onclick="handleTag('입시 네비게이션이 뭐야?')">📍 입시 책임제</div>
                <div class="tag" onclick="handleTag('학교 폭력 대책 궁금해')">🤝 화해중재단</div>
                <div class="tag" onclick="handleTag('AI 인재교육원 설립?')">🚀 AI 인재양성</div>
                <div class="tag" onclick="handleTag('교권 보호 정책은?')">👩‍🏫 선생님 보호</div>
                <div class="tag" onclick="handleTag('안심 귀가 서비스 뭐야?')">🏠 안심 하교</div>
                <div class="tag" onclick="handleTag('글로벌 브릿지가 뭐야?')">🌉 다문화 지원</div>
            </div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="질문을 자유롭게 입력해보세요..." onkeypress="if(event.keyCode==13) send()">
            <button id="send-btn" onclick="send()">전송</button>
        </div>
    </div>
</div>

<script>
    // 모든 공약 데이터베이스 구축 (유연한 검색을 위한 키워드 확장)
    const db = [
        { 
            keys: ['아침', '밥', '먹', '식사', '케어', '굿모닝'], 
            title: "🍱 아침 든든, 경남형 온(溫)케어", 
            main: "설레는 아침, '굿모닝 경남'이 해결하겠습니다. 편의점의 차가운 의자가 아니라 학교의 따뜻한 식탁에서 하루를 시작하게 하겠습니다. ", 
            sub: "• '경남 로컬푸드 굿모닝 식탁' 운영 [cite: 3]<br>• '아침 깨움, 신나는 몸놀림' 프로그램 [cite: 3]" 
        },
        { 
            keys: ['입시', '대학', '진학', '네비', '정보', '상담'], 
            title: "📍 경남 에듀-네비 (입시 책임제)", 
            main: "부모님의 정보력이 아이의 대학을 결정하는 불공정, 이제 경남에서 끝내겠습니다. 거창 산골 아이도 똑같은 고급 정보를 누려야 합니다. [cite: 29]", 
            sub: "• 5대 권역별 '거점 대입정보센터' 상설화 [cite: 29]<br>• 찾아가는 진학 119 '입시 셔틀 상담소' [cite: 32]" 
        },
        { 
            keys: ['학폭', '폭력', '갈등', '중재', '싸움', '조정'], 
            title: "🤝 다독임(All-Care) 화해중재단", 
            main: "갈등이 소송으로 번지기 전, 교육감 직속 조정관을 파견해 끊어진 대화의 다리를 놓겠습니다. 학교를 회복의 공간으로 만듭니다. [cite: 25]", 
            sub: "• 교육감 직속 갈등조정관 파견 [cite: 26]<br>• '서로존중 화해중재단' 운영 [cite: 26]" 
        },
        { 
            keys: ['학력', '공부', '기초', '튜터', '포기', '에듀체크'], 
            title: "✏️ AI 맞춤형 튜터링", 
            main: "수업 시간에 멍하니 앉아 있는 '포기자'가 없도록 하겠습니다. 공부할 수 있는 기초 체력은 교육청이 만듭니다. [cite: 3]", 
            sub: "• AI 학습 분석 플랫폼 '에듀-체크' [cite: 4]<br>• 교육감 직속 '기초학력 1:1 전담 튜터제' [cite: 4]" 
        },
        { 
            keys: ['교사', '교권', '리스펙트', '자긍심', '선생님', '보호'], 
            title: "👩‍🏫 경남 리스펙트(Respect) 365", 
            main: "선생님이 행복해야 아이들이 웃습니다. 교권 보호를 선언이 아닌 시스템으로 확실히 실천하겠습니다. [cite: 46]", 
            sub: "• 교육감 직속 '교권신속법률대응단' 가동 [cite: 46]<br>• '학교 업무 제로화' 추진 [cite: 46]" 
        },
        { 
            keys: ['귀가', '하교', '안전', '방패', '사고'], 
            title: "🏠 Safe-Home 안심 귀가", 
            main: "학교 문을 나서는 순간부터 집 현관문 손잡이를 잡는 순간까지 교육청의 보호 아래 있게 하겠습니다. [cite: 37]", 
            sub: "• 스마트 안심 그리드(Grid) 구축 [cite: 38]<br>• '사람이 지키는 안심 귀가 도우미' 전면 배치 [cite: 38]" 
        },
        { 
            keys: ['다문화', '이주', '글로벌', '브릿지', '언어'], 
            title: "🌉 경남 글로벌 브릿지", 
            main: "다문화 아이들의 차이를 세계로 뻗어 나갈 '무기'로 바꿔주겠습니다. 경남의 다양성이 경쟁력입니다. [cite: 17, 20]", 
            sub: "• '이중언어 영재교육원' 상설 운영 [cite: 20]<br>• '모국 글로벌 리더십 캠프' [cite: 20]" 
        }
    ];

    const win = document.getElementById('chat-win');
    const input = document.getElementById('userInput');

    function handleTag(txt) { input.value = txt; send(); }

    function send() {
        const txt = input.value.trim();
        if(!txt) return;

        // 사용자 메시지
        const uDiv = document.createElement('div');
        uDiv.className = 'msg user-msg';
        uDiv.innerText = txt;
        win.appendChild(uDiv);
        input.value = '';
        win.scrollTop = win.scrollHeight;

        // 로봇 답변 (의도 파악 로직 강화)
        setTimeout(() => {
            // 문장 내에 키워드가 하나라도 포함되어 있는지 확인
            let found = db.find(item => item.keys.some(k => txt.toLowerCase().includes(k)));
            
            if(found) {
                const bDiv = document.createElement('div');
                bDiv.className = 'msg bot-card';
                bDiv.innerHTML = `
                    <span class="p-title">${found.title}</span>
                    <span class="p-text">${found.main}</span>
                    <div class="p-list"><b>[세부 실천 약속]</b>${found.sub}</div>
                `;
                win.appendChild(bDiv);
            } else {
                const eDiv = document.createElement('div');
                eDiv.className = 'msg bot-card';
                eDiv.innerText = "죄송해요, 제가 그 부분은 아직 다 학습하지 못했어요. 😅 '아침밥', '입시', '교권' 등 키워드로 물어봐 주시면 정성껏 답변해 드릴게요!";
                win.appendChild(eDiv);
            }
            win.scrollTop = win.scrollHeight;
        }, 400);
    }
</script>
</body>
</html>
