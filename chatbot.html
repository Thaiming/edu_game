<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>김영곤 AI 대변인</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --magenta: #e20074; --dark: #1a1a1a; --bg: #f9f9fb; }
        body { font-family: 'Pretendard', sans-serif; background: #edeff2; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 480px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        #header { padding: 20px; border-bottom: 2px solid var(--magenta); background: white; text-align: center; }
        #header h1 { margin: 0; font-size: 1.15rem; color: var(--dark); font-weight: 800; }
        #header p { margin: 5px 0 0; font-size: 0.85rem; color: var(--magenta); font-weight: 700; }
        #chat-win { flex: 1; padding: 15px; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 90%; animation: slideUp 0.3s ease; }
        .bot-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; align-self: flex-start; }
        .user-msg { align-self: flex-end; background: var(--dark); color: white; padding: 10px 16px; border-radius: 20px 20px 2px 20px; font-size: 0.95rem; }
        .p-img { width: 100%; border-radius: 12px; margin-bottom: 12px; display: block; border: 1px solid #f0f0f0; }
        .p-title { font-weight: 700; color: var(--magenta); display: block; margin-bottom: 8px; font-size: 1.05rem; }
        .p-text { font-size: 0.92rem; line-height: 1.6; color: #333; word-break: keep-all; }
        #bottom-section { background: white; border-top: 1px solid #eee; padding: 15px; }
        .tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .tags::-webkit-scrollbar { display: none; }
        .tag { white-space: nowrap; padding: 9px 16px; background: white; color: var(--magenta); border-radius: 50px; font-size: 0.82rem; cursor: pointer; border: 1.5px solid var(--magenta); font-weight: 600; flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 14px 20px; border: 1px solid #ddd; border-radius: 30px; outline: none; font-size: 1rem; }
        #send-btn { background: var(--magenta); color: white; border: none; padding: 0 22px; border-radius: 30px; cursor: pointer; font-weight: 700; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="app">
    <div id="header">
        <h1>김영곤 경남교육감 예비후보 AI 대변인</h1>
        <p>경남 아이들의 24시간을 새롭게 설계합니다</p>
    </div>
    <div id="chat-win" id="chatWin">
        <div class="msg bot-card">
            반갑습니다! 😊 <b>전 교육부 차관보 김영곤</b>입니다.<br><br>
            대한민국 교육 정책을 설계해 온 33년의 행정 전문가적 정밀함으로, <b>경남 아이들의 하루 24시간</b>을 빈틈없이 책임질 약속들을 정리했습니다.<br><br>
            아침 등교부터 밤늦은 귀가까지, 경남 교육의 미래가 궁금하시다면 아래 <b>핵심 프로젝트</b>를 확인해 주세요.
        </div>
    </div>
    <div id="bottom-section">
        <div class="tags">
            <div class="tag" onclick="handleTag('아침 든든 온케어')">🍱 아침밥(온케어)</div>
            <div class="tag" onclick="handleTag('입시 책임제')">📍 에듀-네비(입시)</div>
            <div class="tag" onclick="handleTag('교권 리스펙트')">👩‍🏫 교사 자긍심회복</div>
            <div class="tag" onclick="handleTag('안심 귀가 서비스')">🏠 Safe-Home 귀가</div>
            <div class="tag" onclick="handleTag('AI 르네상스')">💡 미래 인재 교육</div>
        </div>
        <div class="input-row"><input type="text" id="userInput" placeholder="궁금한 정책을 다정하게 물어보세요..."><button id="send-btn" onclick="send()">전송</button></div>
    </div>
</div>

<script>
    // 숫자 노출 제거 및 정제된 공약 데이터베이스 (총 17장 반영)
    const db = [
        { keys: ['아침', '밥', '온케어', '식사'], img: 'card01.jpg', title: "경남형 온(溫)케어 (08:00)", text: "부모님의 아침 1시간을 여유로, 아이의 아침을 활력으로 채우겠습니다." },
        { keys: ['튜터', '기초', '학습', '결손'], img: 'card02.jpg', title: "AI 맞춤형 튜터링 (09:00)", text: "경남 아이들의 학습 결손을 0%로 만드는 정밀한 교육 행정을 실현합니다." },
        { keys: ['인공지능', '윤리', '인성'], img: 'card03.jpg', title: "경남 AI+H 프로젝트 (09:30)", text: "기술에 매몰되지 않는 '사람 냄새 나는 테크 학교'를 만듭니다." },
        { keys: ['인재', '교육원', '실험'], img: 'card04.jpg', title: "AI 인재교육원 설립 (10:00)", text: "최고의 목수가 집을 짓듯, 준비된 시설에서 미래 인재를 키우겠습니다." },
        { keys: ['르네상스', '질문', '인문학'], img: 'card05.jpg', title: "경남 르네상스 AI 교육 (10:30)", text: "정답을 외우는 능력보다 '더 가치 있는 질문'을 던지는 힘을 기릅니다." },
        { keys: ['글로벌', '브릿지', '다문화', '이주'], img: 'card06.jpg', title: "경남 글로벌 브릿지 (11:00)", text: "이주배경 아이들의 차이를 세계로 뻗어 나갈 '강점'으로 바꿔주겠습니다." },
        { keys: ['급식', '점심', '쉼터', '로컬푸드'], img: 'card07.jpg', title: "교육 급식과 마음 쉼터 (12:00)", text: "식판 위에 경남의 미래를 담겠습니다. 로컬푸드 기반 프리미엄 급식을 약속합니다." },
        { keys: ['화해', '중재', '다독임', '폭력'], img: 'card08.jpg', title: "다독임 화해중재단 (13:00)", text: "학교 폭력 갈등, 이제 소송이 아닌 대화와 중재로 회복의 다리를 놓겠습니다." },
        { keys: ['네비', '입시', '정보', '불공정'], img: 'card09.jpg', title: "경남 에듀-네비 (15:00)", text: "정보력이 실력이 되지 않도록, 공교육이 입시의 나침반이 되어드립니다." },
        { keys: ['배달', '119', '찾아가는', '상담'], img: 'card10.jpg', title: "찾아가는 진학 119 (15:30)", text: "바쁜 학부모님을 위해 입시 정보를 주거지 가까이 '배달'해 드립니다." },
        { keys: ['할매', '할배', '어르신', '농어촌'], img: 'card11.jpg', title: "온마을 할매·할배 돌봄 (16:00)", text: "어르신의 지혜와 아이들의 웃음이 만나는 상생의 돌봄 모델을 구축합니다." },
        { keys: ['귀가', '하교', '안전', '방패'], img: 'card12.jpg', title: "Safe-Home 안심 귀가 (16:30)", text: "학교 문부터 집 현관까지 아이를 보호하는 '디지털 방패'를 마련하겠습니다." },
        { keys: ['연수', '패스파인더', '교사', '전문가'], img: 'card13.jpg', title: "패스파인더 교사 연수 (17:00)", text: "선생님의 시야가 넓어지는 만큼 경남 교육의 세상도 넓어집니다." },
        { keys: ['교권', '자긍심', '리스펙트', '365'], img: 'card14.jpg', title: "경남 리스펙트 365 (17:30)", text: "교육감 직속 교권대응단과 업무 제로화로 선생님의 자긍심을 지킵니다." },
        { keys: ['치유', '테라피', '쉼터', '사찰'], img: 'card15.jpg', title: "종교 협력 마음 회복 (18:00)", text: "지역 공동체의 품에서 상처받은 선생님들의 마음을 따뜻하게 치유하겠습니다." },
        { keys: ['작은학교', '폐교', '클러스터', '빌리지'], img: 'card16.jpg', title: "올인원 교육 클러스터 (18:30)", text: "교육 때문에 지역을 떠나지 않는 '지속 가능한 경남'을 만들겠습니다." },
        { keys: ['스마트폰', '쉼', '중독', '사유'], img: 'card17.jpg', title: "디지털-쉼 캠페인 (19:00)", text: "학교 안만큼은 온전한 대화와 사유가 흐르는 공간으로 되돌려 놓겠습니다." }
    ];

    const win = document.getElementById('chat-win');
    const input = document.getElementById('userInput');
    function handleTag(t) { input.value = t; send(); }
    function send() {
        const t = input.value.trim(); if(!t) return;
        win.innerHTML += `<div class="msg user-msg">${t}</div>`;
        input.value = '';
        setTimeout(() => {
            let f = db.find(i => i.keys.some(k => t.toLowerCase().includes(k)));
            if(f) {
                win.innerHTML += `<div class="msg bot-card"><img src="${f.img}" class="p-img"><span class="p-title">${f.title}</span><span class="p-text">${f.text}</span></div>`;
            } else {
                win.innerHTML += `<div class="msg bot-card">경남 교육의 미래를 설계하는 김영곤의 약속들 중 궁금하신 키워드(아침밥, 입시, 돌봄 등)를 말씀해 주세요! 😊</div>`;
            }
            win.scrollTop = win.scrollHeight;
        }, 350);
    }
</script>
</body>
</html>
