<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>김영곤 AI 대변인</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --magenta: #e20074; --dark: #1a1a1a; --bg: #f9f9fb; }
        body { font-family: 'Pretendard', sans-serif; background: #edeff2; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 480px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        #header { padding: 20px; border-bottom: 2px solid var(--magenta); background: white; text-align: center; }
        #header h1 { margin: 0; font-size: 1.15rem; color: var(--dark); font-weight: 800; }
        #header p { margin: 5px 0 0; font-size: 0.85rem; color: var(--magenta); font-weight: 700; }
        #chat-win { flex: 1; padding: 15px; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 90%; animation: slideUp 0.3s ease; }
        .bot-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; align-self: flex-start; }
        .user-msg { align-self: flex-end; background: var(--dark); color: white; padding: 10px 16px; border-radius: 20px 20px 2px 20px; font-size: 0.95rem; }
        .p-img { width: 100%; border-radius: 12px; margin-bottom: 12px; display: block; border: 1px solid #f0f0f0; }
        .p-title { font-weight: 700; color: var(--magenta); display: block; margin-bottom: 8px; font-size: 1.05rem; }
        .p-text { font-size: 0.92rem; line-height: 1.6; color: #333; word-break: keep-all; }
        #bottom-section { background: white; border-top: 1px solid #eee; padding: 15px; }
        .tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .tags::-webkit-scrollbar { display: none; }
        .tag { white-space: nowrap; padding: 9px 16px; background: white; color: var(--magenta); border-radius: 50px; font-size: 0.82rem; cursor: pointer; border: 1.5px solid var(--magenta); font-weight: 600; flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 14px 20px; border: 1px solid #ddd; border-radius: 30px; outline: none; font-size: 1rem; }
        #send-btn { background: var(--magenta); color: white; border: none; padding: 0 22px; border-radius: 30px; cursor: pointer; font-weight: 700; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="app">
    <div id="header">
        <h1>김영곤 경남교육감 예비후보 AI 대변인</h1>
        <p>아이의 하루를 책임지는 따뜻한 약속</p>
    </div>
    <div id="chat-win" id="chatWin">
        <div class="msg bot-card">안녕하세요! 김영곤 후보의 AI 대변인입니다. 😊<br>17가지 모든 약속 카드를 준비했습니다. 궁금한 점을 물어보세요!</div>
    </div>
    <div id="bottom-section">
        <div class="tags">
            <div class="tag" onclick="handleTag('아침밥')">🍱 아침밥</div>
            <div class="tag" onclick="handleTag('입시 네비게이션')">📍 입시 책임제</div>
            <div class="tag" onclick="handleTag('교권 보호')">👩‍🏫 교사 자긍심</div>
            <div class="tag" onclick="handleTag('안심 귀가')">🏠 안심 하교</div>
            <div class="tag" onclick="handleTag('AI 교육')">💡 AI 르네상스</div>
            <div class="tag" onclick="handleTag('작은 학교')">🏘️ 지역 학교</div>
        </div>
        <div class="input-row"><input type="text" id="userInput" placeholder="질문을 입력하세요..."><button id="send-btn" onclick="send()">전송</button></div>
    </div>
</div>

<script>
    const db = [
        { keys: ['아침', '밥', '온케어'], img: 'card01.jpg', title: "경남형 온(溫)케어 (08:00)", text: "따뜻한 식탁으로 아이의 아침을 활력으로 채우겠습니다. " },
        { keys: ['튜터', '기초', '학습'], img: 'card02.jpg', title: "AI 맞춤형 튜터링 (09:00)", text: "공교육의 힘으로 기초 학력 결손 0%를 실현합니다. " },
        { keys: ['AI', '세상', '윤리'], img: 'card03.jpg', title: "AI+H 프로젝트 (09:30)", text: "AI보다 따뜻하고 창의적인 인재를 키워내겠습니다. " },
        { keys: ['인재', '교육원', '올트먼'], img: 'card04.jpg', title: "AI 인재교육원 설립 (10:00)", text: "최고의 시설과 유능한 선생님이 계신 경남을 만듭니다. " },
        { keys: ['르네상스', '질문', '인문학'], img: 'card05.jpg', title: "경남 르네상스 AI 교육 (10:30)", text: "AI는 답을 주지만 가치는 사람이 결정합니다. " },
        { keys: ['글로벌', '브릿지', '다문화'], img: 'card06.jpg', title: "경남 글로벌 브릿지 (11:00)", text: "다문화 학생을 글로벌 인재로, 경남의 보석으로 키웁니다. " },
        { keys: ['급식', '점심', '쉼터'], img: 'card07.jpg', title: "교육 급식과 마음 쉼터 (12:00)", text: "로컬푸드 기반 프리미엄 급식과 카페형 쉼터를 조성합니다. " },
        { keys: ['화해', '중재', '다독임'], img: 'card08.jpg', title: "다독임 화해중재단 (13:00)", text: "갈등이 커지기 전 이음의 다리를 놓는 회복의 공간을 만듭니다. " },
        { keys: ['네비', '입시', '정보'], img: 'card09.jpg', title: "경남 에듀-네비 (15:00)", text: "공교육 입시 책임제로 정보의 불공정을 끝내겠습니다. " },
        { keys: ['배달', '119', '찾아가는'], img: 'card10.jpg', title: "찾아가는 진학 119 (15:30)", text: "입시 정보를 학부모님의 주거지 가까이 배달합니다. " },
        { keys: ['할매', '할배', '어르신'], img: 'card11.jpg', title: "온마을 할매·할배 돌봄 (16:00)", text: "농어촌 특화 돌봄으로 세대 공감과 사랑을 전합니다. " },
        { keys: ['귀가', '하교', '방패'], img: 'card12.jpg', title: "Safe-Home 안심 귀가 (16:30)", text: "디지털 방패로 아이의 하굣길을 끝까지 지키겠습니다. " },
        { keys: ['연수', '패스파인더', '교사'], img: 'card13.jpg', title: "패스파인더 교사 연수 (17:00)", text: "선생님이 직접 기획하는 고품격 글로벌 연수를 지원합니다. " },
        { keys: ['교권', '자긍심', '리스펙트'], img: 'card14.jpg', title: "경남 리스펙트 365 (17:30)", text: "선생님의 자긍심을 시스템으로 확실히 보호하겠습니다. " },
        { keys: ['치유', '테라피', '쉼터'], img: 'card15.jpg', title: "종교 협력 마음 회복 (18:00)", text: "지역 공동체와 협력하여 선생님의 마음을 치유해 드립니다. " },
        { keys: ['작은학교', '폐교', '마을'], img: 'card16.jpg', title: "올인원 교육 클러스터 (18:30)", text: "교육 때문에 지역을 떠나지 않는 에듀-빌리지를 조성합니다. " },
        { keys: ['스마트폰', '쉼', '중독'], img: 'card17.jpg', title: "디지털-쉼 캠페인 (19:00)", text: "학교 안을 온전한 사유와 대화의 공간으로 되돌리겠습니다. " }
    ];

    const win = document.getElementById('chat-win');
    const input = document.getElementById('userInput');
    function handleTag(t) { input.value = t; send(); }
    function send() {
        const t = input.value.trim(); if(!t) return;
        win.innerHTML += `<div class="msg user-msg">${t}</div>`;
        input.value = '';
        setTimeout(() => {
            let f = db.find(i => i.keys.some(k => t.toLowerCase().includes(k)));
            if(f) {
                win.innerHTML += `<div class="msg bot-card"><img src="${f.img}" class="p-img"><span class="p-title">${f.title}</span><span class="p-text">${f.text}</span></div>`;
            } else {
                win.innerHTML += `<div class="msg bot-card">다정하게 말씀해 주시면 17가지 공약 카드 중 딱 맞는 정보를 찾아드릴게요! 😊</div>`;
            }
            win.scrollTop = win.scrollHeight;
        }, 350);
    }
</script>
</body>
</html>
