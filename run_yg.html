<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>슈퍼 영곤 러너 - 150점 대항해</title>
    <style>
        :root { --main: #FF8A00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Pretendard', sans-serif; touch-action: none; }
        #stage { position: relative; width: 100vw; height: 100vh; max-width: 480px; margin: 0 auto; background: #87CEEB; overflow: hidden; transition: 0.8s; }
        #start-guide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .touch-icon { font-size: 50px; animation: b 1s infinite; }
        @keyframes b { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        #floor { position: absolute; bottom: 0; width: 200%; height: 60px; background: linear-gradient(90deg, #8BC34A 50%, #689F38 50%); background-size: 80px 100%; animation: f 0.8s linear infinite; z-index: 10; }
        @keyframes f { from { transform: translateX(0); } to { transform: translateX(-80px); } }
        #ui { position: absolute; top: 20px; width: 100%; z-index: 100; text-align: center; color: white; text-shadow: 1px 1px 4px #000; }
        #hero-p { position: absolute; left: 50px; bottom: 60px; z-index: 50; display: flex; flex-direction: column; align-items: center; transition: 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #hero { font-size: 55px; animation: r 0.3s infinite alternate; }
        @keyframes r { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
        .obj { position: absolute; z-index: 40; font-size: 45px; display: flex; flex-direction: column; align-items: center; }
        .tag { font-size: 10px; background: #fff; padding: 2px 5px; border-radius: 5px; margin-bottom: 2px; font-weight: bold; color: #333; }
        #end { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,138,0,0.95); display: none; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; }
    </style>
</head>
<body onclick="handleTouch()">
<div id="stage">
    <div id="start-guide">
        <div class="touch-icon">👆</div>
        <div style="font-size: 20px; margin-top: 10px; font-weight:bold;">터치해서 150점 만점<br>경남 대항해 시작!</div>
    </div>
    <div id="ui">
        <div style="font-size:12px; background:white; color:var(--main); display:inline-block; padding:2px 10px; border-radius:15px; font-weight:bold; margin-bottom:5px;">경남의 미래 김영곤</div>
        <div style="font-size:24px; font-weight:900;">✨ <span id="s">0</span> / 150점</div>
        <div style="font-size:16px; font-weight:bold;">📍 <span id="l">남해군</span></div>
    </div>
    <div id="hero-p">
        <div style="background:rgba(0,0,0,0.6); color:#fff; font-size:10px; padding:2px 6px; border-radius:8px; margin-bottom:4px; font-weight:bold;">김영곤</div>
        <div id="hero">👦🏻</div>
    </div>
    <div id="floor"></div>
    <div id="end">
        <h1 style="font-size:40px;">🎊 당선 확정! 🎊</h1>
        <div style="font-size:80px; margin:20px;">👨🏻‍💼</div>
        <p style="font-weight:bold; line-height:1.6;">150점 만점 달성!<br>18개 시군의 미래를 설계할<br>김영곤 교육감이 되었습니다!</p>
        <button onclick="location.reload()" style="padding:15px 40px; border-radius:30px; border:none; background:#fff; color:var(--main); font-weight:bold; font-size:18px; margin-top:20px;">다시 하기</button>
    </div>
</div>
<script>
    let score = 0, isJ = false, rIdx = 0, gameActive = false;
    // 150점 만점을 위해 25점 단위로 6개 지역 구성
    const rgs = [
        { n: "남해", bg: "#87CEEB", i: "🏫", e: "📉", iN: "기숙학교", eN: "소멸위기" },
        { n: "진주", bg: "#A5D8FF", i: "📚", e: "🧱", iN: "에듀콘텐츠", eN: "노후시설" },
        { n: "사천", bg: "#2B3A67", i: "🚀", e: "🚫", iN: "우주교육", eN: "인재유출" },
        { n: "의령", bg: "#D8F5A2", i: "🤝", e: "🏚️", iN: "공동학교", eN: "학교폐쇄" },
        { n: "김해", bg: "#FFD8A8", i: "🏛️", e: "📉", iN: "가야교실", eN: "문화격차" },
        { n: "창원", bg: "#E9ECEF", i: "💻", e: "🌫️", iN: "디지털교육", eN: "정보격차" }
    ];

    function handleTouch() {
        if (!gameActive) {
            gameActive = true;
            document.getElementById('start-guide').style.display = 'none';
            setInterval(create, 1500); 
        }
        jump();
    }

    function jump() {
        if (isJ) return; isJ = true;
        document.getElementById('hero-p').style.bottom = "240px";
        setTimeout(() => { document.getElementById('hero-p').style.bottom = "60px"; setTimeout(() => isJ = false, 300); }, 400);
    }

    function create() {
        if (!gameActive) return;
        const isI = Math.random() > 0.4, obj = document.createElement('div'), data = rgs[rIdx % rgs.length];
        obj.className = 'obj';
        obj.innerHTML = `<span class="tag">${isI?data.iN:data.eN}</span><span>${isI?data.i:data.e}</span>`;
        obj.style.bottom = isI ? "210px" : "60px";
        obj.style.left = "100%";
        document.getElementById('stage').appendChild(obj);
        
        let px = window.innerWidth;
        let m = setInterval(() => {
            px -= 7; obj.style.left = px + "px";
            let h = document.getElementById('hero-p').getBoundingClientRect(), o = obj.getBoundingClientRect();
            if (h.right > o.left + 15 && h.left < o.right - 15 && h.bottom > o.top - 10 && h.top < o.bottom + 10) {
                if (isI) { score += 10; updateGame(); } 
                else { score = Math.max(0, score - 5); updateGame(); }
                document.getElementById('s').innerText = score;
                obj.remove(); clearInterval(m);
            }
            if (px < -100) { obj.remove(); clearInterval(m); }
        }, 16);
    }

    function updateGame() {
        if (score >= 150) {
            document.getElementById('end').style.display = 'flex';
            gameActive = false;
            return;
        }
        // 25점마다 지역 변경 (150점 만점에 6개 지역)
        let newIdx = Math.floor(score / 25);
        if (newIdx !== rIdx && newIdx < rgs.length) {
            rIdx = newIdx;
            document.getElementById('l').innerText = rgs[rIdx].n;
            document.getElementById('stage').style.background = rgs[rIdx].bg;
        }
        // 75점부터 전문가로 변신
        if (score >= 75) document.getElementById('hero').innerText = "👨🏻‍💼";
        else document.getElementById('hero').innerText = "👦🏻";
    }
</script>
</body>
</html>
